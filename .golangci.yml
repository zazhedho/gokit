version: "2"

run:
  timeout: 5m
  tests: true
  modules-download-mode: readonly
  relative-path-mode: gomod

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

linters:
  default: none
  enable:
    - bodyclose
    - dupl
    - errorlint
    - errcheck
    - gosec
    - govet
    - ineffassign
    - misspell
    - nilerr
    - noctx
    - prealloc
    - revive
    - rowserrcheck
    - sqlclosecheck
    - staticcheck
    - unconvert
    - unused
  settings:
    revive:
      rules:
        - name: var-naming
        - name: exported
        - name: package-comments
    dupl:
      threshold: 200
    misspell:
      locale: US
  exclusions:
    rules:
      - path: internal/messages/message.go
        linters:
          - gosec
        text: "G101: Potential hardcoded credentials"
      - path: _test\.go
        linters:
          - noctx

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/zazhedho/gokit
